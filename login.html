<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Elossence</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Auth Specific Styles */
  .auth-wrapper { display: flex; min-height: calc(100vh - 86px); }
  .auth-image { flex: 1; background-color: var(--bg-alt); }
  .auth-form-container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
  .auth-form-container h2 { font-size: 3rem; margin-bottom: 0.5rem; }
  .auth-form-container > p { color: var(--plum-soft); margin-bottom: 2.5rem; font-size: 1.1rem; }
  
  .auth-form { display: flex; flex-direction: column; gap: 1.5rem; }
  .auth-form input { padding: 1rem; background: transparent; border: none; border-bottom: 1px solid rgba(75, 50, 48, 0.3); font-family: 'Jost', sans-serif; color: var(--plum); font-size: 1rem; outline: none; transition: border-color 0.3s; }
  .auth-form input:focus { border-bottom-color: var(--plum); }
  .auth-form button { margin-top: 1rem; padding: 1.2rem; background: var(--plum); color: var(--ivory); border: none; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 0.3s; font-size: 13px; font-weight: 500; }
  .auth-form button:hover { background: var(--rose); }
  .auth-links { margin-top: 2rem; display: flex; justify-content: space-between; font-size: 0.9rem; flex-wrap: wrap; gap: 10px; }

  @media(max-width: 768px) {
    .auth-wrapper { flex-direction: column; }
    .auth-image { min-height: 30vh; }
    .auth-form-container { padding: 4rem 5%; }
  }
  .form-message { min-height: 1.2rem; font-size: 0.9rem; margin-top: -0.5rem; }
  .form-message.error { color: #b3392f; }
  .form-message.success { color: #3d7a4f; }
</style>
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <div class="logo-area" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <div class="logo-mark"><span class="loop loop-left"></span><span class="loop loop-right"></span></div>
        <span class="logo-text">elossence</span>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="men/men.html">Men</a>
        <a href="women/index.html">Women</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="index.html#recently-viewed">Recently Viewed</a>
        <a href="wishlist.html" class="wishlist-nav">
          <span class="nav-heart">♡</span>
          <span class="wishlist-count">0</span>
        </a>
      </nav>
      <div class="nav-actions">
        <button onclick="window.location.href='login.html'">Login</button>
        <button class="dark" onclick="window.location.href='signup.html'">Sign Up</button>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>
  
  <section class="auth-wrapper">
    <div class="auth-image" style="background: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80') center/cover;"></div>
    
    <div class="auth-form-container">
      <h2 class="serif">Welcome Back</h2>
      <p>Enter your details to access your inner circle account.</p>
      
      <form class="auth-form" id="loginForm" novalidate>
        <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <p class="form-message" id="formMessage" role="alert"></p>
        <button type="submit" class="dark">Sign In</button>
      </form>
      
      <div class="auth-links">
        <a href="#">Forgot Password?</a>
        <p>Don't have an account? <a href="signup.html" style="color: var(--rose); font-weight: 500;">Sign Up</a></p>
      </div>
    </div>
  </section>

  <script src="users.js"></script>
  <script src="script.js"></script>
  <script src="loginsign.js"></script>
</body>
</html>
