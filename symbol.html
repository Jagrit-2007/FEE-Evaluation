<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elossence — Brand Mark</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');

  :root{
    --ivory: #FBF3EF;
    --plum: #4B3230;
    --plum-soft: #7A5450;
    --rose: #C1877E;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--ivory);
    font-family: 'Cormorant Garamond', serif;
    color: var(--plum);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .concept {
    border: 1px solid rgba(75,50,48,0.15);
    border-radius: 2px;
    padding: 60px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 400px;
    background: #fff;
  }

  .mark {
    width: 130px;
    height: 130px;
    margin-bottom: 20px;
  }

  .wordB {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    letter-spacing: .42em;
    color: var(--plum);
    margin: 0;
    padding-left: .42em;
    text-transform: lowercase;
  }

  .label {
    font-size: 15px;
    letter-spacing: .08em;
    color: var(--plum-soft);
    font-style: italic;
    margin: 18px 0 8px;
  }

  .why {
    font-size: 15px;
    color: var(--plum-soft);
    line-height: 1.6;
    margin-top: 14px;
  }
</style>
</head>
<body>

  <div class="concept">
    <svg class="mark" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 55 C20 35, 45 35, 55 55 C65 75, 90 75, 90 55 C90 35, 65 35, 55 55 C45 75, 20 75, 20 55 Z"
            fill="none" stroke="#C1877E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="wordB">elossence</p>
    <p class="label">the ribbon mark</p>
    <p class="why">An endless ribbon knot, referencing continuity and craftsmanship. Wide letter-spacing gives it a couture, garment-label feel.</p>
  </div>

</body>
</html>
